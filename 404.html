<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | RushUp Esports</title>
  <meta name="robots" content="noindex, follow">

  <!-- Clean URL Fallback & Automatic Redirection for GitHub Pages -->
  <script>
    (function() {
      try {
        var rawPath = window.location.pathname.toLowerCase().replace(/\/$/, '');
        var cleanName = rawPath.split('/').pop();
        if (cleanName === 'register' || cleanName === 'form' || cleanName === 'registration') {
          window.location.replace('./register.html' + window.location.search + window.location.hash);
        } else if (cleanName === 'contact' || cleanName === 'support') {
          window.location.replace('./contact.html' + window.location.search + window.location.hash);
        } else if (cleanName === 'leagues' || cleanName === 'tournaments') {
          window.location.replace('./leagues.html' + window.location.search + window.location.hash);
        } else if (cleanName === 'tournament-details' || cleanName === 'details') {
          window.location.replace('./tournament-details.html' + window.location.search + window.location.hash);
        } else if (cleanName === 'privacy') {
          window.location.replace('./privacy.html' + window.location.search + window.location.hash);
        } else if (cleanName === 'terms') {
          window.location.replace('./terms.html' + window.location.search + window.location.hash);
        }
      } catch (e) {
        console.error('Redirection error:', e);
      }
    })();
  </script>

  <link rel="icon" type="image/png" href="./icons/rushup_icon.png">
  <link rel="apple-touch-icon" href="./icons/rushup_icon.png">
  
  <link rel="stylesheet" href="./css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
